[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dracoviloc-gui"
version = "0.1.0"
description = "Local and remote desktop control center for DracoViLoc"
requires-python = ">=3.10,<3.11"
dependencies = ["PySide6>=6.8,<6.9", "asyncssh>=2.18,<3", "docker>=7,<8"]

[project.optional-dependencies]
test = ["pytest>=7,<8", "pytest-qt>=4"]

[project.scripts]
dracoviloc-gui = "dracoviloc_gui.main:main"

[tool.setuptools]
packages = ["dracoviloc_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

