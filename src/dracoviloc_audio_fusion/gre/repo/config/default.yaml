# DRACOVILOC - configuration par defaut
# Source unique de verite pour tous les hyperparametres (CLAUDE.md #1.3, #14).
# Aucune valeur magique ne doit etre codee en dur ailleurs : tout notebook charge ce fichier
# en premiere cellule.

seed: 42

# ---------------------------------------------------------------------------
# Pretraitement causal (CLAUDE.md #4)
# ---------------------------------------------------------------------------
preprocessing:
  sample_rate: 24000          # Nyquist 12 kHz -> couvre 3-9 kHz avec marge
  frame_duration_s: 0.025
  frame_hop_s: 0.010
  sequence_duration_s: 1.0
  inference_hop_s: 0.10
  # filtre IIR causal (scipy.signal.sosfilt + etat zi, jamais sosfiltfilt)
  bandpass_order: 4

# ---------------------------------------------------------------------------
# Features (CLAUDE.md #5)
# ---------------------------------------------------------------------------
features:
  # feature_set par defaut pour le notebook 2 (qui entraine de toute facon les 3 pistes).
  # PISTE OPERATIONNELLE (server/, notebooks 3 et 4) = "mfcc" (reference litterature),
  # PAS "lfcc_hf" (pourtant la piste principale du cahier des charges, CLAUDE.md #5.1).
  # Historique de la decision (run 20260817_230629 -> mfcc -> run 20260817_235623 -> lfcc_hf
  # -> run 20260818_035232 -> mfcc, 3e bascule) :
  #   1. mfcc avait d'abord egale/depasse lfcc_hf sur rappel + FA/min + robustesse parole/
  #      musique, d'ou un premier passage a mfcc ;
  #   2. l'ajout du silence/bruit ambiant pur comme negatif d'entrainement a renverse le
  #      verdict : lfcc_hf devenait totalement propre sur parole/instruments/silence (0 FP,
  #      FA/min=0.095) avec le meme rappel que mfcc -- retour a lfcc_hf ;
  #   3. l'audit d'implementation a trouve que 4 des 5 descripteurs spectraux de lfcc_hf
  #      (centroide/rolloff/flatness/flux) n'etaient PAS restreints a la bande 3-9 kHz comme
  #      annonce (seul le SNR l'etait) -- un offset DC/ronflement secteur hors-bande dominait
  #      ces features. Une fois la restriction reellement appliquee et le modele reentraine,
  #      lfcc_hf s'est mis a detecter "drone" sur du bruit large-bande generique stationnaire
  #      (96.5% de faux positif sur un bruit rose neutre, test synthetique) : le jeu de
  #      donnees actuel est trop petit pour apprendre une signature drone fiable dans une
  #      bande aussi etroite. mfcc/wideband (bande complete, jamais restreinte par ce
  #      correctif) restent propres sur les memes tests adverses (DC, ronflement, bruit
  #      stationnaire) -- retour a mfcc (meilleur rappel que wideband sur le test).
  # Cette decision a deja bascule TROIS fois -- ne jamais la considerer figee. A rouvrir
  # des que le jeu de donnees (notamment les scenes ambiant_silence/bruit stationnaire) est
  # substantiellement agrandi, ou si un futur audit trouve un correctif a la fragilite de
  # lfcc_hf plutot que de contourner le probleme en changeant de piste.
  feature_set: "mfcc"      # mfcc (piste operationnelle actuelle, reference litterature) | lfcc_hf (principal spec initiale, actuellement fragile -- voir historique) | wideband (reference)
  # band_hf_low_hz teste a 500 Hz (piste 2, notebook 2) suite a l'analyse spectrale d'UN clip
  # de test montrant peu d'energie en 3-9 kHz -- mais l'analyse des 30 clips Svanstrom montre
  # une variance enorme (0.7% a 59.5% d'energie en 3-9 kHz selon le clip, mediane 20.4%) : le
  # clip initial n'etait pas representatif. Elargir la bande a degrade tous les indicateurs
  # (FA/min 0.59->1.93, parasites 22.5s->48.7s) sans corriger le rappel -- revert a 3000 Hz.
  # La vraie cause est la petite taille et l'heterogeneite du pool source (30 clips), pas le
  # choix de bande -- cf. discussion dans le notebook 2.
  band_hf_low_hz: 3000
  band_hf_high_hz: 9000
  n_cepstral_coeffs: 20
  include_c0: false
  # piste experimentale "logmel" (run dedie) : hypothese que la DCT du MFCC supprime le
  # "peigne" harmonique produit par les pales, precisement la signature discriminante d'un
  # drone -- meme banc de filtres mel que mfcc mais SANS DCT, log-mel brut, 64 bandes (au
  # lieu de 40->20 coeffs) pour resoudre le peigne. Piste ajoutee a cote de mfcc, ne remplace
  # rien -- voir reports/PERFORMANCE_LOGMEL.md pour le verdict (critere : TPR@FPR=1%).
  n_logmel_bands: 64
  # descripteurs spectraux complementaires (#5.2) : energie relative/SNR, centroide,
  # roll-off, flatness, flux -- toujours inclus, non parametrables en v1

# ---------------------------------------------------------------------------
# Donnees / scenes (CLAUDE.md #3)
# ---------------------------------------------------------------------------
data:
  # donnees brutes deplacees sur D: (802 Go libres vs 3.9 Go sur C:) -- CLAUDE.md #14 :
  # une seule source de verite, ce chemin absolu est desormais LA reference (D:/drone/data
  # est un chemin absolu, non relatif a PROJECT_ROOT). Les scenes generees (data/audio/,
  # petites, quelques dizaines de Mo) restent sur C: avec le reste du projet.
  raw_dir: "D:/drone/data/raw"
  audio_dir: "data/audio"
  manifest_path: "data/manifest.csv"
  annotations_path: "data/annotations.csv"
  scene_duration_s: 45.0
  long_negative_duration_s: 90.0
  snr_db:
    drone_foule: 3.0
    drone_voiture: 3.0
  splits:
    train: 0.6
    validation: 0.2
    test: 0.2

# ---------------------------------------------------------------------------
# Modele - GRU causal leger (CLAUDE.md #6)
# ---------------------------------------------------------------------------
model:
  type: "GRU"
  # ABLATION EN COURS (run 20260821_133958 avec hidden=48/2 couches) : val_loss diverge des
  # l'epoque 5 sur les 4 pistes simultanement (jamais mieux qu'a l'epoque 0), TPR@FPR=1% chute
  # de 50.9% a 0.6% sur logmel. Retour temporaire a hidden=32/1 couche pour isoler si la cause
  # est l'architecture ou la composition des nouvelles donnees (v10) -- a trancher avant de
  # conclure quoi que ce soit sur l'augmentation de capacite demandee par l'utilisateur.
  hidden_size: 32
  num_layers: 1
  bidirectional: false        # [CONTRAINTE] jamais true dans le chemin temps reel
  dropout: 0.0
  output: "framewise_drone_score"

# ---------------------------------------------------------------------------
# Entrainement (CLAUDE.md #7)
# ---------------------------------------------------------------------------
training:
  batch_size: 16
  learning_rate: 0.001
  max_epochs: 100
  early_stopping_patience: 10
  loss: "bce"
  exclude_transition_windows: true

# ---------------------------------------------------------------------------
# Decision temporelle (CLAUDE.md #8) - valeurs par defaut, ecrasees par piste
# ---------------------------------------------------------------------------
# Ces valeurs ne sont QUE le repli par defaut (utilise si un run n'a pas encore de seuils
# calibres). Les valeurs REELLEMENT utilisees en pratique (server/app.py, notebooks 3/4/5,
# src/report_performance.py, src/calibrate_thresholds*.py) vivent dans le sous-dictionnaire
# `decision` de chaque checkpoint runs/<horodatage>/model_<feature_set>.pt -- via
# `{**config["decision"], **checkpoint["decision"]}`. Ecrire ici ne change PAS le
# comportement d'une piste deja entrainee ; il faut patcher le checkpoint
# (src/apply_calibrated_decision.py).
#
# Piste `logmel`, run 20260820_143017 : threshold_on=0.4, threshold_off=0.12,
# min_presence_s=0.8, min_absence_s=0.1 (inchange). Adopte 2026-08-20 --
# reports/CALIBRATION_LOGMEL_V2.md, point #1 (plateau, pas un optimum isole). Critere :
# maximiser rappel(sim_factor=4)>=50% ET fragmentation<=1.5, minimiser FA/heure -- domine
# strictement l'ancien point (meme FA/heure=13.61 (3 evenements absolus), rappel(sim_factor=4)
# 17%->67%, fragmentation 1.27->1.19). Calibre sur validation enrichie de positifs "eloignes"
# simules (sim_factor = difficulte relative, PAS une distance physique --
# reports/DISTANCE_SIM_CHECK.md). Applique au checkpoint via
# src/apply_calibrated_decision.py, PAS en modifiant ces valeurs par defaut.
decision:
  threshold_on: 0.80
  threshold_off: 0.40
  min_presence_s: 0.50
  min_absence_s: 0.50
  smoothing_s: 0.20

# ---------------------------------------------------------------------------
# Baseline energie 3-9 kHz (metre-etalon, CLAUDE.md #9)
# ---------------------------------------------------------------------------
baseline:
  band_low_hz: 3000
  band_high_hz: 9000
