controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_tracking_controller:
      type: forward_command_controller/ForwardCommandController
    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    dual_arm_tracking_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true

arm_tracking_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    interface_name: position

dual_arm_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true

dual_arm_tracking_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    interface_name: position
